# Publish the game to GitHub Pages (https://callumhemsley.github.io/junyan/)
# on every push to main. Pages serves the gh-pages branch, so this builds
# main and commits the built site there, one commit per publish.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push replaces a queued one.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Commit the build to gh-pages
        run: |
          rsync -a --delete --exclude .git dist/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The built site is unchanged; nothing to publish."
            exit 0
          fi
          git commit -q -m "Publish ${GITHUB_SHA::8} from main" -m "Built by the Publish site workflow from ${GITHUB_SHA}."
          git push origin HEAD:gh-pages

<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Independent pathfinding timing harness</title><style>body{margin:0;font:14px sans-serif;background:#fbf7ef}canvas{width:390px;height:312px;display:block}pre{white-space:pre-wrap}</style><p>Isolated published town geometry. Not the production viewport.</p><canvas width="390" height="312"></canvas><pre id="result"></pre><script type="module">
import {canStand,canWalk,findPath} from './geometry.mjs';
const map=await(await fetch('./town.json')).json();const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scale=390/80,from=map.defaultSpawn;
window.runs=[];window.longTasks=[];new PerformanceObserver(list=>window.longTasks.push(...list.getEntries().map(e=>({start:e.startTime,duration:e.duration})))).observe({type:'longtask',buffered:true});
function draw(path=[]){ctx.fillStyle='#ded8c7';ctx.fillRect(0,0,390,312);ctx.fillStyle='#b5c5ac';for(const r of map.walkable)ctx.fillRect(r.x*scale,r.y*scale,r.width*scale,r.height*scale);ctx.fillStyle='#675b4c';for(const {rect:r} of map.colliders)ctx.fillRect(r.x*scale,r.y*scale,r.width*scale,r.height*scale);ctx.strokeStyle='#164b83';ctx.beginPath();ctx.moveTo(from.x*scale,from.y*scale);for(const p of path)ctx.lineTo(p.x*scale,p.y*scale);ctx.stroke();}
canvas.addEventListener('click',event=>{const bounds=canvas.getBoundingClientRect(),to={x:(event.clientX-bounds.left)/scale,y:(event.clientY-bounds.top)/scale},start=performance.now();const path=findPath(map,from,to),done=performance.now();draw(path);let previous=from;const valid=path.every(p=>{const ok=canWalk(map,previous,p);previous=p;return ok});const row={to,searchMs:done-start,pathPoints:path.length,endpointValid:canStand(map,to),pathValid:valid,endsAtTarget:!!path.length&&Math.hypot(previous.x-to.x,previous.y-to.y)<1e-8};requestAnimationFrame(()=>{row.clickHandlerToFrameMs=performance.now()-start;window.runs.push(row);document.querySelector('#result').textContent=JSON.stringify(row,null,2)});});draw();window.ready=true;
</script>

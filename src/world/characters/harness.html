<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>人物动作试验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d7d6bc;color:#302b2a;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:20px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}figcaption{margin:8px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#d7d6bc;touch-action:none;border:2px solid #736a59}canvas:focus-visible{outline:3px solid #302b2a;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select{min-height:44px;padding:8px 12px;font:inherit;color:inherit;background:#fbf7ef;border:1px solid #8b846f;border-radius:4px}output{display:block;min-height:44px;padding:12px 0}#sheet{width:100%;max-width:784px}p{line-height:1.5}@media(max-width:650px){section{grid-template-columns:1fr}main{padding:12px}h1{font-size:18px}}
</style>
<main><h1>人物动作试验</h1><p>方向键走动，轻点地面走近。此处为动作试验场。</p>
<div class="controls"><label>人物 <select id="cast"><option value="player">我</option><option value="lin-jie">林姐</option><option value="xiao-li">小李</option><option value="zhang-laoshi">张老师</option><option value="xiao-zhou">小周</option></select></label><label>动作 <select id="pose"><option value="stand">站</option><option value="sit">坐</option><option value="crouch">蹲</option><option value="work">做事</option><option value="react">招呼</option></select></label><button id="carry">托盘</button><button id="freeze">静止</button></div>
<section><figure><figcaption>原来</figcaption><canvas id="before" width="360" height="280" aria-label="原来的人物"></canvas></figure><figure><figcaption>现在</figcaption><canvas id="after" width="360" height="280" tabindex="0" aria-label="走动试验"></canvas></figure></section>
<output id="state"></output><canvas id="sheet" width="448" height="400" aria-label="人物方向和动作"></canvas></main><script type="module" src="./harness.ts"></script></html>
